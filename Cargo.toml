[package]
name = "deckr"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Rust implementation of the Deckr protocols and shared runtime"
readme = "README.md"
include = ["src/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = []
nats = ["dep:async-nats"]
# Enable the integration test target that reads fixtures from kws/deckr.
conformance = []

[[test]]
name = "conformance"
required-features = ["conformance"]

[[example]]
name = "interop"
required-features = ["nats"]

[dependencies]
async-nats = { version = "0.47", default-features = false, features = ["kv", "ring", "server_2_11"], optional = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3"
futures-core = "0.3"
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
jsonschema = { version = "0.59", default-features = false, features = ["arbitrary-precision", "idna"] }
num-bigint = "0.4"
num-rational = "0.4"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0"
tokio = { version = "1.39", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "time"] }
